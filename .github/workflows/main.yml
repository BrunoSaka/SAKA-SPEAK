name: SAKA SPEAK - Deploy Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy SAKA SPEAK
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Mengambil semua file dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Menyiapkan GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Mengunggah file website
      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Mempublikasikan website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
